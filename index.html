<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>עורך כרזת זמני תפילות | שדמות מחולה</title>
<style>
  :root {
    --page: #f5f1e9; --card: #fffdf9; --ink: #2b2416; --ink2: #6f6757; --hair: #e5ddcc; --gold: #b8860b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--page); color: var(--ink); font-family: -apple-system, "Segoe UI", "Noto Sans Hebrew", Arial, sans-serif; }
  .card { max-width: 720px; margin: 0 auto; background: var(--card); min-height: 100vh; padding: 28px 18px 40px; box-shadow: 0 0 40px rgba(60,45,15,.08); }
  header h1 { font-family: "Frank Ruhl Libre", "David", serif; font-size: 30px; margin: 6px 0 2px; font-weight: 700; }
  header .fact { color: var(--ink2); margin: 0 0 10px; font-size: 15px; }
  header .intro { margin: 0 0 14px; font-size: 16px; line-height: 1.55; }
  footer { margin-top: 22px; color: var(--ink2); font-size: 13px; text-align: center; }

  .ed { display: flex; flex-direction: column; gap: 12px; padding: 4px 0 8px; }
  .ed > * { min-width: 0; }
  .ed-label { font-weight: 700; font-size: 17px; margin-top: 10px; }
  .ed-bgs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .ed-bgs > * { min-width: 0; }
  .ed-bg { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px; border: 2px solid var(--hair); border-radius: 14px; background: transparent; cursor: pointer; font: inherit; color: var(--ink); min-height: 44px; }
  .ed-bg img { width: 100%; aspect-ratio: 9 / 12; object-fit: cover; border-radius: 9px; display: block; }
  .ed-bg span { font-size: 14px; font-weight: 600; }
  .ed-bg.is-on { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(184,134,11,.25); }
  .ed-preview { display: flex; justify-content: center; }
  .ed-preview canvas { width: 100%; max-width: 430px; height: auto; border-radius: 14px; box-shadow: 0 8px 28px rgba(20,40,80,.22); display: block; }
  .ed-loading { padding: 60px 0; color: var(--ink2); }
  .ed-dl { border: none; border-radius: 999px; padding: 15px 20px; font: inherit; font-size: 19px; font-weight: 800; color: #5a4305; background: linear-gradient(180deg,#ffd98a,#f0b429); cursor: pointer; box-shadow: 0 4px 14px rgba(90,67,5,.3); min-height: 44px; }
  .ed-dl:disabled { opacity: .55; cursor: default; }
  .ed-row { border: 1px solid var(--hair); border-radius: 14px; padding: 10px 12px 12px; margin: 0; }
  .ed-row legend { font-weight: 700; font-size: 15px; padding: 0 6px; }
  .ed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ed-grid > * { min-width: 0; }
  .ed-f { display: flex; flex-direction: column; gap: 4px; }
  .ed-f span { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .ed-f input { font: inherit; font-size: 17px; padding: 11px 12px; border: 1.5px solid var(--hair); border-radius: 10px; background: #fff; color: var(--ink); min-height: 44px; width: 100%; min-width: 0; }
  .ed-f input:focus { outline: 2px solid rgba(184,134,11,.5); border-color: var(--gold); }
  .ed-reset { border: 1.5px solid var(--hair); background: transparent; color: var(--ink2); border-radius: 999px; padding: 11px 18px; font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; align-self: center; }
  .ed-saved { margin: 0; font-size: 13px; color: var(--ink2); text-align: center; min-height: 1em; }
  @media (max-width: 420px) { .ed-bgs { grid-template-columns: repeat(2, 1fr); } .card { padding: 20px 12px 32px; } }
</style>
</head>
<body>
  <main class="card">
    <header>
      <h1>עורך כרזת זמני תפילות</h1>
      <p class="fact">שדמות מחולה</p>
      <p class="intro">מזינים את הפרשה והשעות, בוחרים רקע - והכרזה מתעדכנת מיד. בסוף מורידים תמונת PNG מוכנה לשיתוף בוואטסאפ.</p>
    </header>
    <div id="editor"><div class="ed-loading">טוען...</div></div>
    <footer>הזמנים והבחירות נשמרים במכשיר הזה בלבד. לשינוי בעיצוב או רקע חדש - פנו לסוכן.</footer>
  </main>
  <script type="module" src="./editor.js"></script>
</body>
</html>
